<!doctype html>
<html lang="ko">
<head>
<!-- sign-board v1.1.0 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쨈하니 도마생성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Hi+Melody&family=Jua&display=swap">
<style>
  :root { --bg:#14161a; --panel:#1d2025; --line:#2c3037; --text:#e8eaed; --sub:#8b919a; --accent:#00ffa3; --danger:#ff5d5d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,'Malgun Gothic',sans-serif; -webkit-user-select:none; user-select:none; }
  textarea, input { -webkit-user-select:text; user-select:text; }
  .wrap { display:grid; grid-template-columns:340px minmax(0,1fr); gap:16px; padding:16px; min-height:100vh; }
  .side { display:flex; flex-direction:column; gap:16px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:12px; }
  h2 { margin:0; font-size:14px; color:var(--sub); font-weight:600; }
  .top { display:flex; align-items:center; gap:10px; }
  .top a { color:var(--sub); text-decoration:none; font-size:13px; }
  .top a:hover { color:var(--accent); }
  .top h1 { margin:0; font-size:18px; }
  textarea { width:100%; min-height:84px; resize:vertical; padding:10px; border-radius:8px; border:1px solid var(--line); background:#14161a; color:var(--text); font-size:18px; font-family:inherit; line-height:1.4; }
  textarea:focus, select:focus { outline:1px solid var(--accent); }
  select { width:100%; padding:8px; border-radius:8px; border:1px solid var(--line); background:#14161a; color:var(--text); font-size:14px; }
  label.row { display:grid; grid-template-columns:64px 1fr 40px; align-items:center; gap:8px; font-size:13px; color:var(--sub); }
  label.row output { text-align:right; color:var(--text); font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  input[type=color] { width:36px; height:28px; padding:0; border:1px solid var(--line); border-radius:6px; background:none; cursor:pointer; }
  .seg { display:flex; gap:6px; }
  .btn { flex:1; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:#262a31; color:var(--text); font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; transition:background .12s, border-color .12s; }
  .btn:hover { background:#2f343c; }
  .btn.on { border-color:var(--accent); color:var(--accent); background:rgba(0,255,163,.1); }
  .btn.primary { border-color:var(--accent); background:var(--accent); color:#06281b; }
  .btn.primary:hover:not(:active) { filter:brightness(1.08); }
  .btn.danger:hover { border-color:var(--danger); color:var(--danger); }
  .btn.small { flex:0 0 auto; padding:7px 10px; font-size:13px; }
  .stage { display:flex; flex-direction:column; gap:10px; min-width:0; }
  .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .toolbar .sep { width:1px; height:22px; background:var(--line); }
  .toolbar label { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--sub); }
  .toolbar input[type=range] { width:110px; }
  .canvas-box { position:relative; width:100%; border-radius:10px; overflow:hidden; background:#000; }
  canvas#view { display:block; width:100%; height:auto; touch-action:none; cursor:crosshair; }
  #cursor { position:absolute; pointer-events:none; border:1.5px solid rgba(0,0,0,.7); box-shadow:0 0 0 1px rgba(255,255,255,.8); border-radius:50%; transform:translate(-50%,-50%); display:none; }
  .export { display:flex; gap:8px; }
  .export .btn { padding:13px; font-size:16px; }
  .keys { display:grid; grid-template-columns:auto 1fr; gap:8px 12px; align-items:center; margin:0; padding:0 4px; font-size:13px; color:var(--sub); }
  .keys dt { display:flex; gap:4px; }
  .keys dd { margin:0; }
  kbd { min-width:24px; padding:2px 7px; border-radius:5px; border:1px solid #3a3f48; border-bottom-width:3px; background:#262a31; color:var(--text); font:600 12px/1.4 system-ui,sans-serif; text-align:center; }
  /* 누를 때 살짝 눌리는 효과 */
  .btn, .seg .btn { transition:background .12s, border-color .12s, transform .08s; }
  .btn:active { transform:translateY(1px) scale(.97); filter:brightness(.92); }
  .btn.primary:active { filter:brightness(.92); }
  .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); background:#262a31; border:1px solid var(--accent); color:var(--text); padding:10px 18px; border-radius:999px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.err { border-color:var(--danger); }
  .toolbar .ico { display:none; }
  @media (max-width:820px) {
    .wrap { grid-template-columns:1fr; padding:12px; gap:10px; align-content:start; }
    /* 미리보기·도구·저장 버튼을 각각 그리드 칸으로 풀어서 미리보기만 위에 고정 */
    .stage { display:contents; }
    .canvas-box { order:-3; position:sticky; top:0; z-index:10; aspect-ratio:885/555; box-shadow:0 6px 16px rgba(0,0,0,.55); }
    /* 도마 부분만 잘라서 확대 (원본 x 200~1085, y 60~615 영역) — 저장되는 이미지는 그대로 전체 */
    canvas#view { width:calc(100% * 1280 / 885); max-width:none; margin-left:calc(-100% * 200 / 885); margin-top:calc(-100% * 60 / 885); }
    .toolbar { order:-2; flex-wrap:nowrap; gap:6px; padding:6px 8px; }
    .toolbar .lbl, .toolbar .sep { display:none; }
    .toolbar .ico { display:inline; }
    .toolbar input[type=range] { width:64px; min-width:0; flex:1; }
    .toolbar label:first-of-type { flex:1; min-width:0; }
    .toolbar .btn.small { padding:7px 9px; }
    .export { order:-1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div class="top"><a href="../">← 메인</a><h1>쨈하니 도마생성기</h1></div>

    <section class="panel">
      <h2>글자</h2>
      <textarea id="text" spellcheck="false" placeholder="내일&#10;데뷔">내일
데뷔</textarea>
      <div class="seg">
        <button class="btn" data-preset="messy">망가진 손글씨</button>
        <button class="btn" data-preset="cute">귀여운 글씨</button>
      </div>
      <select id="font"></select>
      <label class="row">크기<input type="range" id="size" min="20" max="100" value="80"><output></output></label>
      <label class="row">굵기<input type="range" id="stroke" min="0" max="20" value="3"><output></output></label>
      <label class="row">줄간격<input type="range" id="lineh" min="70" max="200" value="125"><output></output></label>
      <label class="row">자간<input type="range" id="spacing" min="-20" max="60" value="0"><output></output></label>
      <label class="row">망가짐<input type="range" id="mess" min="0" max="200" value="70"><output></output></label>
      <div class="seg">
        <button class="btn" id="shuffle">🎲 다시 섞기</button>
        <label class="btn" style="display:flex;align-items:center;justify-content:center;gap:8px;flex:0 0 auto">색 <input type="color" id="color" value="#111111"></label>
      </div>
    </section>

    <dl class="keys">
      <dt><kbd>Ctrl</kbd><kbd>Z</kbd></dt><dd>되돌리기</dd>
      <dt><kbd>Ctrl</kbd><kbd>Shift</kbd><kbd>C</kbd></dt><dd>복사</dd>
      <dt><kbd>Ctrl</kbd><kbd>S</kbd></dt><dd>저장</dd>
    </dl>
  </aside>

  <main class="stage">
    <div class="toolbar">
      <button class="btn small on" data-tool="pen" title="펜">✏️<span class="lbl"> 펜</span></button>
      <button class="btn small" data-tool="eraser" title="지우개">🧽<span class="lbl"> 지우개</span></button>
      <span class="sep"></span>
      <label title="펜 굵기"><span class="lbl">굵기</span> <input type="range" id="penSize" min="2" max="60" value="12"></label>
      <label title="펜 색"><span class="lbl">색</span> <input type="color" id="penColor" value="#111111"></label>
      <span class="sep"></span>
      <button class="btn small" id="undo" title="되돌리기">↶<span class="lbl"> 되돌리기</span></button>
      <button class="btn small danger" id="clearDraw" title="그림 지우기"><span class="ico">🗑️</span><span class="lbl">그림 지우기</span></button>
      <button class="btn small danger" id="clearText" title="글자 지우기"><span class="ico">⌫</span><span class="lbl">글자 지우기</span></button>
    </div>
    <div class="canvas-box">
      <canvas id="view" width="1280" height="655"></canvas>
      <div id="cursor"></div>
    </div>
    <div class="export">
      <button class="btn primary" id="copy">📋 클립보드에 복사</button>
      <button class="btn" id="save">💾 PNG 저장</button>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="base.js"></script>
<script>
(() => {
  const W = 1280, H = 655;
  // 팻말 흰 면 (원본 이미지 기준)
  const BOARD = { x0: 223, y0: 80, x1: 1062, y1: 594 };
  // 글자를 맞춰 넣을 영역 (손 위쪽 공간 기준)
  const TEXT_BOX = { x0: 250, y0: 100, x1: 1035, y1: 575 };

  // url 이 있는 폰트는 눈누(jsDelivr)에서 불러온다. 없으면 구글 폰트.
  const NOON = 'https://fastly.jsdelivr.net/gh/projectnoonnu/';
  const UHBEE = (f) => NOON + 'noonfonts_five@.2.0/UhBee' + f + '.woff';
  const FONTS = [
    { group: '망가진 손글씨', name: '감자꽃', family: 'Gamja Flower' },
    { group: '망가진 손글씨', name: '어비 지슉지슉', family: 'UhBee Jisyukjisyuk', url: UHBEE('Jisyukjisyuk') },
    { group: '망가진 손글씨', name: '어비 찌빠빠', family: 'UhBee JJIBBABBA', url: UHBEE('JJIBBABBA') },
    { group: '망가진 손글씨', name: '어비 쌀', family: 'UhBee Rice', url: UHBEE('Rice') },
    { group: '망가진 손글씨', name: '어비 컹컹', family: 'UhBee KeongKeong', url: UHBEE('KeongKeong') },
    { group: '망가진 손글씨', name: '어비 혜키', family: 'UhBee Hyeki', url: UHBEE('Hyeki') },
    { group: '망가진 손글씨', name: '어비 세현', family: 'UhBee Se_hyun', url: UHBEE('Se_hyun') },
    { group: '망가진 손글씨', name: '어비 지글', family: 'UhBee ZIGLE', url: UHBEE('ZIGLE') },
    { group: '망가진 손글씨', name: '어비 버찌', family: 'UhBee BEOJJI', url: UHBEE('BEOJJI') },
    { group: '깔끔한 손글씨', name: '하이멜로디', family: 'Hi Melody' },
    { group: '깔끔한 손글씨', name: '오뮤 다예쁨', family: 'omyu pretty', url: NOON + 'noonfonts_2304-01@1.0/omyu_pretty.woff2' },
    { group: '깔끔한 손글씨', name: '도브메이요', family: 'Dovemayo gothic', url: NOON + 'noonfonts_2302@1.1/Dovemayo_gothic.woff2' },
    { group: '깔끔한 손글씨', name: '교보 손글씨', family: 'Kyobo Hand', url: NOON + 'noonfonts_20-04@1.0/KyoboHand.woff' },
    { group: '귀여운 글씨', name: '주아', family: 'Jua' },
    { group: '귀여운 글씨', name: '카페24 써라운드', family: 'Cafe24 Ssurround', url: NOON + 'noonfonts_2105_2@1.0/Cafe24Ssurround.woff' },
    { group: '귀여운 글씨', name: '배민 한나 Pro', family: 'BM Hanna Pro', url: NOON + 'noonfonts_seven@1.0/BMHANNAPro.woff' },
    { group: '귀여운 글씨', name: '여기어때 잘난체', family: 'Yg Jalnan', url: NOON + 'noonfonts_four@1.2/JalnanOTF00.woff' },
  ];
  // 눈누 폰트 @font-face 등록 (실제 다운로드는 선택할 때만 일어남)
  document.head.appendChild(Object.assign(document.createElement('style'), {
    textContent: FONTS.filter(f => f.url).map(f => `@font-face{font-family:"${f.family}";src:url("${f.url}");font-display:swap;}`).join('\n'),
  }));
  const PRESETS = {
    messy: { font: 'Gamja Flower', stroke: 3, mess: 70, size: 92, lineh: 115, spacing: 10 },
    cute:  { font: 'Jua', stroke: 0, mess: 0, size: 80, lineh: 105, spacing: 0 },
  };

  const $ = (id) => document.getElementById(id);
  const view = $('view'), vctx = view.getContext('2d');
  const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
  const textLayer = mk(), drawLayer = mk(), inkLayer = mk(), maskLayer = mk();
  const tctx = textLayer.getContext('2d', { willReadFrequently: true });
  const dctx = drawLayer.getContext('2d');
  const ictx = inkLayer.getContext('2d');
  const base = new Image();

  const fontSel = $('font');
  const groups = {};
  FONTS.forEach((f, i) => {
    let g = groups[f.group];
    if (!g) { g = groups[f.group] = document.createElement('optgroup'); g.label = f.group; fontSel.appendChild(g); }
    const o = document.createElement('option'); o.value = i; o.textContent = f.name; g.appendChild(o);
  });

  let seed = 20261122;
  let textDirty = true;

  // ---------- 유틸 ----------
  function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const val = (id) => Number($(id).value);
  function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

  function syncOutputs() {
    document.querySelectorAll('label.row').forEach(l => { const i = l.querySelector('input'), o = l.querySelector('output'); if (o) o.textContent = i.value; });
  }

  // ---------- 마스크: 팻말 흰 면만 (손가락/액자는 제외) ----------
  function buildMask() {
    const c = mk(), x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(base, 0, 0);
    const src = x.getImageData(0, 0, W, H), d = src.data;
    const out = x.createImageData(W, H), o = out.data;
    // 흰 면 판정: 무채색이고 밝은 픽셀 (피부/액자처럼 색이 있으면 제외)
    const alphaAt = (p) => {
      const i = p * 4, r = d[i], g = d[i + 1], b = d[i + 2];
      const mn = Math.min(r, g, b), mx = Math.max(r, g, b);
      if (mx - mn > 16) return 0;
      return Math.max(0, Math.min(1, (mn - 185) / 35));
    };
    // 팻말 가운데에서 이어진 흰 면만 채운다 → 손 안쪽의 밝은 하이라이트는 제외됨
    const seen = new Uint8Array(W * H);
    const start = ((BOARD.y0 + BOARD.y1) >> 1) * W + ((BOARD.x0 + BOARD.x1) >> 1);
    const stack = [start]; seen[start] = 1;
    while (stack.length) {
      const p = stack.pop(), a = alphaAt(p);
      if (a <= 0) continue;
      o[p * 4 + 3] = a * 255;
      if (a < 0.5) continue;                     // 가장자리 반투명 픽셀에서는 더 번지지 않음
      const px = p % W, py = (p / W) | 0;
      if (px > BOARD.x0 && !seen[p - 1]) { seen[p - 1] = 1; stack.push(p - 1); }
      if (px < BOARD.x1 && !seen[p + 1]) { seen[p + 1] = 1; stack.push(p + 1); }
      if (py > BOARD.y0 && !seen[p - W]) { seen[p - W] = 1; stack.push(p - W); }
      if (py < BOARD.y1 && !seen[p + W]) { seen[p + W] = 1; stack.push(p + W); }
    }
    maskLayer.getContext('2d').putImageData(out, 0, 0);
  }

  // ---------- 글자 레이아웃 ----------
  function layout(font) {
    const R = 100;
    tctx.font = `${font.weight || 400} ${R}px "${font.family}"`;
    tctx.textAlign = 'center'; tctx.textBaseline = 'middle';
    const m = val('mess') / 100, lh = val('lineh') / 100 * R, sp = val('spacing') / 100 * R;
    const r = rng(seed);
    const lines = $('text').value.replace(/\r/g, '').split('\n');
    while (lines.length > 1 && lines[lines.length - 1].trim() === '') lines.pop();
    const glyphs = [];
    lines.forEach((line, li) => {
      const chars = Array.from(line);
      const lineRot = (r() - 0.5) * 0.14 * m;
      const lineDx = (r() - 0.5) * 0.9 * R * m;
      const lineDy = (r() - 0.5) * 0.2 * R * m;
      const row = [];
      let x = 0;
      chars.forEach((ch) => {
        const mt = tctx.measureText(ch);
        const w = mt.width;
        const s = 1 + (r() - 0.5) * 0.45 * m;
        const sx = s * (1 + (r() - 0.5) * 0.4 * m), sy = s * (1 + (r() - 0.5) * 0.4 * m);
        const skew = (r() - 0.5) * 0.45 * m;
        const rot = (r() - 0.5) * 0.4 * m;
        const dy = (r() - 0.5) * 0.3 * R * m;
        const gap = (r() - 0.25) * 0.35 * R * m;
        // 실제 잉크 영역 (textAlign center / textBaseline middle 기준)
        const ink = ch.trim() === '' ? null : {
          l: -mt.actualBoundingBoxLeft, r: mt.actualBoundingBoxRight,
          t: -mt.actualBoundingBoxAscent, b: mt.actualBoundingBoxDescent,
        };
        row.push({ ch, adv: w * sx, s, sx, sy, skew, rot, ink, x: x + w * sx / 2, y: dy });
        x += w * sx + gap + sp;
      });
      const lw = row.length ? row[row.length - 1].x + row[row.length - 1].adv / 2 : 0;
      const ly = (li - (lines.length - 1) / 2) * lh + lineDy;
      const cos = Math.cos(lineRot), sin = Math.sin(lineRot);
      row.forEach(g => {
        const gx = g.x - lw / 2, gy = g.y;
        g.x = gx * cos - gy * sin + lineDx;
        g.y = gx * sin + gy * cos + ly;
        g.rot += lineRot;
        glyphs.push(g);
      });
    });
    // 변형(기울임·회전) 적용한 잉크 경계 상자
    let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
    const pad = val('stroke') / 2;
    glyphs.forEach(g => {
      if (!g.ink) return;
      const c = Math.cos(g.rot), s = Math.sin(g.rot);
      const { l, r: rr, t, b } = g.ink;
      [[l - pad, t - pad], [rr + pad, t - pad], [l - pad, b + pad], [rr + pad, b + pad]].forEach(([px, py]) => {
        const ux = (px + g.skew * py) * g.sx, uy = py * g.sy;
        const X = g.x + ux * c - uy * s, Y = g.y + ux * s + uy * c;
        bx0 = Math.min(bx0, X); bx1 = Math.max(bx1, X);
        by0 = Math.min(by0, Y); by1 = Math.max(by1, Y);
      });
    });
    return { glyphs, R, box: isFinite(bx0) ? { bx0, by0, bx1, by1 } : null };
  }

  // ---------- 손떨림 왜곡 ----------
  function wobble(img, A, L) {
    if (A < 0.3) return img;
    const r = rng(seed ^ 0x9e3779b9);
    const k = Math.PI * 2 / L;
    const f1 = k * (0.8 + r() * 0.5), f2 = k * (0.8 + r() * 0.5), f3 = k * (0.4 + r() * 0.3), f4 = k * (0.4 + r() * 0.3);
    const p1 = r() * 7, p2 = r() * 7, p3 = r() * 7, p4 = r() * 7;
    const src = img.data, out = new ImageData(W, H), o = out.data;
    const rowS = new Float32Array(H), colS = new Float32Array(W);
    for (let y = 0; y < H; y++) rowS[y] = Math.sin(y * f1 + p1);
    for (let x = 0; x < W; x++) colS[x] = Math.sin(x * f2 + p2);
    const y0 = BOARD.y0, y1 = BOARD.y1, x0 = BOARD.x0, x1 = BOARD.x1;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const sx = x + A * (rowS[y] + 0.6 * Math.sin((x + y) * f3 + p3));
      const sy = y + A * (colS[x] + 0.6 * Math.sin((x - y) * f4 + p4));
      const ix = Math.floor(sx), iy = Math.floor(sy), fx = sx - ix, fy = sy - iy;
      if (ix < 0 || iy < 0 || ix >= W - 1 || iy >= H - 1) continue;
      const i00 = (iy * W + ix) * 4 + 3, i10 = i00 + 4, i01 = i00 + W * 4, i11 = i01 + 4;
      const a = (src[i00] * (1 - fx) + src[i10] * fx) * (1 - fy) + (src[i01] * (1 - fx) + src[i11] * fx) * fy;
      o[(y * W + x) * 4 + 3] = a;
    }
    return out;
  }

  function renderText() {
    const font = FONTS[val('font')];
    tctx.clearRect(0, 0, W, H);
    const { glyphs, R, box } = layout(font);
    if (!box) return;
    const bw = box.bx1 - box.bx0, bh = box.by1 - box.by0;
    const tw = TEXT_BOX.x1 - TEXT_BOX.x0, th = TEXT_BOX.y1 - TEXT_BOX.y0;
    const k = Math.min(tw / bw, th / bh) * val('size') / 100;
    const cx = (TEXT_BOX.x0 + TEXT_BOX.x1) / 2 - (box.bx0 + bw / 2) * k;
    const cy = (TEXT_BOX.y0 + TEXT_BOX.y1) / 2 - (box.by0 + bh / 2) * k;
    const strokeW = val('stroke');
    tctx.save();
    tctx.font = `${font.weight || 400} ${R}px "${font.family}"`;
    tctx.textAlign = 'center'; tctx.textBaseline = 'middle';
    tctx.fillStyle = tctx.strokeStyle = '#000';
    tctx.lineJoin = tctx.lineCap = 'round';
    glyphs.forEach(g => {
      tctx.save();
      tctx.translate(cx + g.x * k, cy + g.y * k);
      tctx.rotate(g.rot);
      tctx.scale(g.sx * k, g.sy * k);
      tctx.transform(1, 0, g.skew, 1, 0, 0);
      tctx.fillText(g.ch, 0, 0);
      if (strokeW > 0) { tctx.lineWidth = strokeW / g.s; tctx.strokeText(g.ch, 0, 0); }
      tctx.restore();
    });
    tctx.restore();
    // 망가짐 → 획을 살짝 흔들기 + 색 입히기
    const fontPx = R * k;
    let img = tctx.getImageData(0, 0, W, H);
    img = wobble(img, val('mess') / 100 * fontPx * 0.03, Math.max(30, fontPx * 0.6));
    const [cr, cg, cb] = hexToRgb($('color').value), d = img.data;
    for (let i = 0; i < d.length; i += 4) { d[i] = cr; d[i + 1] = cg; d[i + 2] = cb; }
    tctx.putImageData(img, 0, 0);
  }

  // ---------- 합성 ----------
  // rAF가 늦게 도는 환경(백그라운드 탭 등)에서도 갱신되도록 타이머를 같이 건다
  let raf = 0, timer = 0;
  function requestRender(text) {
    if (text) textDirty = true;
    if (!raf) raf = requestAnimationFrame(render);
    if (!timer) timer = setTimeout(render, 60);
  }
  function render() {
    cancelAnimationFrame(raf); clearTimeout(timer);
    raf = 0; timer = 0;
    if (!base.complete || !base.naturalWidth) return;
    if (textDirty) { textDirty = false; renderText(); }
    ictx.globalCompositeOperation = 'source-over';
    ictx.clearRect(0, 0, W, H);
    ictx.drawImage(textLayer, 0, 0);
    ictx.drawImage(drawLayer, 0, 0);
    ictx.globalCompositeOperation = 'destination-in';
    ictx.drawImage(maskLayer, 0, 0);
    vctx.drawImage(base, 0, 0);
    vctx.drawImage(inkLayer, 0, 0);
  }

  // ---------- 손그림 ----------
  let tool = 'pen';
  const strokes = [];
  let cur = null;
  function paintStroke(ctx, st) {
    const p = st.pts;
    ctx.save();
    ctx.globalCompositeOperation = st.tool === 'eraser' ? 'destination-out' : 'source-over';
    ctx.strokeStyle = ctx.fillStyle = st.color;
    ctx.lineWidth = st.size; ctx.lineCap = ctx.lineJoin = 'round';
    if (p.length === 1) { ctx.beginPath(); ctx.arc(p[0][0], p[0][1], st.size / 2, 0, Math.PI * 2); ctx.fill(); }
    else {
      ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
      for (let i = 1; i < p.length - 1; i++) {
        const mx = (p[i][0] + p[i + 1][0]) / 2, my = (p[i][1] + p[i + 1][1]) / 2;
        ctx.quadraticCurveTo(p[i][0], p[i][1], mx, my);
      }
      const l = p[p.length - 1]; ctx.lineTo(l[0], l[1]);
      ctx.stroke();
    }
    ctx.restore();
  }
  function repaintDraw() {
    dctx.clearRect(0, 0, W, H);
    strokes.forEach(s => paintStroke(dctx, s));
    if (cur) paintStroke(dctx, cur);
    requestRender();
  }
  const toCanvas = (e) => { const r = view.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
  function updateCursor(e) {
    const c = $('cursor'), r = view.getBoundingClientRect(), box = c.parentElement.getBoundingClientRect();
    const d = val('penSize') * r.width / W;
    c.style.width = c.style.height = Math.max(4, d) + 'px';
    c.style.left = (e.clientX - box.left) + 'px'; c.style.top = (e.clientY - box.top) + 'px';
    c.style.display = 'block';
  }
  view.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    view.setPointerCapture(e.pointerId);
    cur = { tool, color: $('penColor').value, size: val('penSize'), pts: [toCanvas(e)] };
    repaintDraw();
  });
  view.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'mouse') updateCursor(e);
    if (!cur) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    (evs.length ? evs : [e]).forEach(ev => cur.pts.push(toCanvas(ev)));
    repaintDraw();
  });
  const endStroke = () => { if (!cur) return; strokes.push(cur); cur = null; repaintDraw(); };
  view.addEventListener('pointerup', endStroke);
  view.addEventListener('pointercancel', endStroke);
  view.addEventListener('pointerleave', () => { $('cursor').style.display = 'none'; });

  document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => {
    tool = b.dataset.tool;
    document.querySelectorAll('[data-tool]').forEach(x => x.classList.toggle('on', x === b));
  }));
  function undo() { if (strokes.length) { strokes.pop(); repaintDraw(); } }
  $('undo').addEventListener('click', undo);
  $('clearDraw').addEventListener('click', () => { if (!strokes.length) return; strokes.length = 0; repaintDraw(); toast('그림을 지웠어요'); });
  $('clearText').addEventListener('click', () => { $('text').value = ''; requestRender(true); $('text').focus(); });

  // ---------- 컨트롤 ----------
  function applyPreset(name) {
    const p = PRESETS[name];
    fontSel.value = FONTS.findIndex(f => f.family === p.font);
    ['stroke', 'mess', 'size', 'lineh', 'spacing'].forEach(k => $(k).value = p[k]);
    document.querySelectorAll('[data-preset]').forEach(b => b.classList.toggle('on', b.dataset.preset === name));
    syncOutputs(); loadFontAndRender();
  }
  document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => applyPreset(b.dataset.preset)));
  ['size', 'stroke', 'lineh', 'spacing', 'mess', 'color'].forEach(id => $(id).addEventListener('input', () => { syncOutputs(); requestRender(true); }));
  $('text').addEventListener('input', loadFontAndRender);
  // 기본 문구 그대로면 입력하러 들어올 때 비움
  const DEFAULT_TEXT = '내일\n데뷔';
  $('text').addEventListener('focus', () => {
    if ($('text').value.replace(/\r/g, '') === DEFAULT_TEXT) { $('text').value = ''; requestRender(true); }
  });
  fontSel.addEventListener('change', loadFontAndRender);
  $('shuffle').addEventListener('click', () => {
    seed = (Math.random() * 2 ** 31) | 0;
    if (val('mess') === 0) { $('mess').value = 70; syncOutputs(); toast('망가짐이 0이라 70으로 올렸어요'); }
    requestRender(true);
  });

  async function loadFontAndRender() {
    const f = FONTS[val('font')];
    try { await document.fonts.load(`${f.weight || 400} 100px "${f.family}"`, $('text').value || '가'); } catch {}
    requestRender(true);
  }
  document.fonts && document.fonts.addEventListener('loadingdone', () => requestRender(true));

  // ---------- 내보내기 ----------
  function blob() { render(); return new Promise(res => view.toBlob(res, 'image/png')); }
  async function copy() {
    try {
      if (!navigator.clipboard || !window.ClipboardItem) throw new Error('unsupported');
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob() })]);
      toast('클립보드에 복사했어요');
    } catch (e) { console.error(e); toast('복사 실패 — PNG 저장을 써주세요', true); }
  }
  async function save() {
    const b = await blob();
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const stamp = `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = `도마_${stamp}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  $('copy').addEventListener('click', copy);
  $('save').addEventListener('click', save);

  document.addEventListener('keydown', (e) => {
    const inText = e.target.tagName === 'TEXTAREA';
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'c') { e.preventDefault(); copy(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
    else if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !inText) { e.preventDefault(); undo(); }
  });

  let toastT;
  function toast(msg, err) {
    const t = $('toast'); t.textContent = msg; t.classList.toggle('err', !!err); t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---------- 시작 ----------
  base.onload = () => { buildMask(); applyPreset('messy'); };
  base.src = window.SIGN_BASE;
})();
</script>
</body>
</html>
