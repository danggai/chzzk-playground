<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>chzzk-playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gamja+Flower&display=swap">
<style>
  :root { --bg:#14161a; --panel:#1d2025; --line:#2a2f37; --text:#e8eaed; --sub:#8b919a; --accent:#00ffa3; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:32px; padding:24px; overflow-x:hidden;
    background:var(--bg) radial-gradient(circle at 1px 1px, #ffffff10 1px, transparent 0) 0 0/22px 22px;
    color:var(--text); font-family:'Jua',system-ui,'Malgun Gothic',sans-serif; }
  header { text-align:center; }
  h1 { margin:0; font-size:clamp(34px,8vw,52px); font-weight:400; letter-spacing:.01em; line-height:1.1; }
  h1 span { display:inline-block; animation:bob 2.4s ease-in-out infinite; }
  h1 .pg { color:var(--accent); }
  @keyframes bob { 0%,100% { transform:translateY(0) rotate(0); } 50% { transform:translateY(-4px) rotate(-2deg); } }
  .tag { margin:10px 0 0; color:var(--sub); font-family:'Gamja Flower',sans-serif; font-size:22px; transform:rotate(-2deg); }
  .menu { display:flex; flex-direction:column; gap:14px; width:min(100%,360px); }
  .btn { display:flex; align-items:center; gap:14px; padding:16px 20px; border-radius:16px; border:2px solid var(--c); background:color-mix(in srgb, var(--c) 10%, transparent); color:var(--c);
    font-size:22px; text-decoration:none; box-shadow:4px 4px 0 color-mix(in srgb, var(--c) 45%, transparent);
    transition:transform .15s, box-shadow .15s, background .15s; }
  .btn:nth-child(odd) { transform:rotate(-1.2deg); }
  .btn:nth-child(even) { transform:rotate(1.2deg); }
  .btn:hover { transform:rotate(0) translate(-2px,-2px) scale(1.03); box-shadow:7px 7px 0 color-mix(in srgb, var(--c) 45%, transparent); background:color-mix(in srgb, var(--c) 18%, transparent); }
  .btn:active { transform:translate(3px,3px); box-shadow:1px 1px 0 color-mix(in srgb, var(--c) 45%, transparent); }
  .btn .ico { font-size:28px; }
  .btn small { display:block; font-family:'Gamja Flower',sans-serif; font-size:16px; opacity:.75; }
  footer { color:#5d636c; font-family:'Gamja Flower',sans-serif; font-size:17px; }
</style>
</head>
<body>
  <header>
    <h1><span>chzzk</span><span class="pg">-playground</span></h1>
    <p class="tag">방송하다 심심할 때 꺼내 노는 장난감 상자</p>
  </header>
  <nav class="menu">
    <a class="btn" style="--c:#ffc83d" href="cheese-roulette/"><span class="ico">🧀</span><span>치즈 룰렛<small>돌려돌려 돌림판</small></span></a>
    <a class="btn" style="--c:#00ffa3" href="sign-board/"><span class="ico">🪧</span><span>팻말 생성기<small>할 말은 팻말로</small></span></a>
  </nav>
  <footer>※ 진지하게 쓰면 안 됨</footer>
</body>
</html>
